$kind: http-request
description: Sets the current quantity, low-stock threshold, and auto-restock preference. Receipt history is unchanged.
url: '{{baseUrl}}/api/pantry/{{pantryStockId}}'
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "quantity": 0.75,
      "lowStockThreshold": 2,
      "autoRestock": true
    }
settings: {}
order: 3000
