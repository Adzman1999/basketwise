$kind: http-request
description: Sets the current quantity, low-stock threshold, auto-restock preference, and optional expiry date. Receipt history is unchanged.
url: '{{baseUrl}}/api/pantry/{{pantryStockId}}'
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "quantity": 0.75,
      "lowStockThreshold": 2,
      "autoRestock": true,
      "expiresOn": "2026-12-15"
    }
settings: {}
order: 3000
