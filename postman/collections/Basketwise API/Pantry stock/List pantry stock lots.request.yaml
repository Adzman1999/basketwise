$kind: http-request
description: Lists current positive-quantity pantry batches ordered by expiry date, with batches without a date last.
url: '{{baseUrl}}/api/pantry/lots?page=1&pageSize=20'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: search
    value: rice
    disabled: true
    description: Literal, case-insensitive substring of a normalized grocery item name.
  - key: page
    value: '1'
    disabled: false
    description: One-based result page.
  - key: pageSize
    value: '20'
    disabled: false
    description: Number of pantry lots per page, up to 100.
settings: {}
examples: './.resources/List pantry stock lots.resources/examples'
order: 4000
