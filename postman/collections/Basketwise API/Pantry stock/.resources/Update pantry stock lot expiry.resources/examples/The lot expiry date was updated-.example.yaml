$kind: http-example
name: The lot expiry date was updated.
request:
  url: "{{baseUrl}}/api/pantry/lots/{{pantryStockLotId}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "expiresOn": "2026-12-15"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "ee7104c9-915b-4789-9efc-134bda74a8bc",
        "pantryStockId": "e024aa98-29b2-4f40-a467-283ed82cbb44",
        "itemName": "Rice",
        "unit": "kg",
        "quantityReceived": 2,
        "quantityRemaining": 1.5,
        "sourceType": "purchase",
        "expiresOn": "2026-12-15",
        "receivedAt": "2026-11-10T08:00:00.000Z",
        "purchaseDate": "2026-11-09",
        "storeName": "Market Basket"
      }
order: 1000
