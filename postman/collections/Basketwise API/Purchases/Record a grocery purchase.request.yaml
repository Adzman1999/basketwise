$kind: http-request
description: |
  Records one or more receipt line items. The API calculates the receipt total
  by summing each item's amountPaidCentavos.
url: '{{baseUrl}}/api/purchases'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "purchasedOn": "2026-10-29",
      "storeName": "Neighborhood Market",
      "items": [
        {
          "itemName": "Rice",
          "quantity": 2,
          "unit": "kg",
          "amountPaidCentavos": 11000
        },
        {
          "itemName": "Bananas",
          "quantity": 1,
          "unit": "pack",
          "amountPaidCentavos": 1300
        }
      ]
    }
settings: {}
examples: ./.resources/Record a grocery purchase.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns HTTP 201', function () {
        pm.response.to.have.status(201);
      });

      pm.test('returns a purchase total calculated from its line items', function () {
        const body = pm.response.json();
        pm.expect(body.currency).to.eql('PHP');
        pm.expect(body.totalPaidCentavos).to.eql(12300);
        pm.expect(body.unallocatedAmountCentavos).to.eql(0);
        pm.expect(body.totalPaidCentavos).to.eql(body.items.reduce(function (total, item) {
          return total + item.amountPaidCentavos;
        }, 0));
        pm.expect(body.items).to.have.lengthOf(2);
        pm.expect(body.items[0].groceryItemId).to.be.a('string');
        pm.collectionVariables.set('lastCreatedPurchaseId', body.id);
        pm.collectionVariables.set('lastGroceryItemId', body.items[0].groceryItemId);
      });
