$kind: http-request
description: |
  Records the receipt total and one or more receipt line items. The
  receipt total is authoritative. The API computes the difference between
  the receipt total and the sum of line amounts as
  unallocatedAmountCentavos; it does not classify that difference as tax,
  discount, fee, or rounding.
url: '{{baseUrl}}/api/purchases'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "purchasedOn": "2026-10-29",
      "storeName": "Neighborhood Market",
      "totalPaidCentavos": 12550,
      "items": [
        {
          "itemName": "Rice",
          "quantity": 2,
          "unit": "kg",
          "amountPaidCentavos": 11000
        },
        {
          "itemName": "Bananas",
          "quantity": 1,
          "unit": "pack",
          "amountPaidCentavos": 1300
        }
      ]
    }
settings: {}
examples: ./.resources/Record a grocery purchase.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns HTTP 201', function () {
        pm.response.to.have.status(201);
      });

      pm.test('returns the saved PHP purchase and unallocated amount', function () {
        const body = pm.response.json();
        pm.expect(body.currency).to.eql('PHP');
        pm.expect(body.totalPaidCentavos).to.eql(12550);
        pm.expect(body.unallocatedAmountCentavos).to.eql(250);
        pm.expect(body.items).to.have.lengthOf(2);
        pm.expect(body.items[0].groceryItemId).to.be.a('string');
        pm.collectionVariables.set('lastCreatedPurchaseId', body.id);
        pm.collectionVariables.set('lastGroceryItemId', body.items[0].groceryItemId);
      });
