$kind: http-example
name: The untracked purchase items were added.
request:
  url: "{{baseUrl}}/api/purchases/{{lastCreatedPurchaseId}}/pantry"
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "pantryRestockedItems": [
          {
            "itemName": "Bananas",
            "unit": "pack",
            "quantityAdded": 1,
            "quantityOnHand": 1,
            "expiresOn": null
          }
        ]
      }
order: 1000
