$kind: http-request
description: |
  Adds the receipt items that have not yet been applied to pantry stock.
  Repeating this request does not add a receipt line twice. The receipt's
  purchased date stays in history; current pantry quantities update now.
url: '{{baseUrl}}/api/purchases/{{lastCreatedPurchaseId}}/pantry'
method: POST
headers:
  Accept: application/json
examples: './.resources/Add untracked purchase items to pantry.resources/examples'
order: 3000
