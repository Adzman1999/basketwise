$kind: http-request
description: Replaces the recipe name, serving yield, optional category and instructions, and complete ingredient list atomically.
url: '{{baseUrl}}/api/recipes/{{recipeId}}'
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: recipeId
    value: '{{recipeId}}'
body:
  type: json
  content: |-
    {
      "name": "Chicken adobo",
      "servings": 4,
      "category": "dinner",
      "instructions": "Brown the chicken, add the sauce, then simmer until tender.",
      "ingredients": [
        {
          "groceryItemId": "{{chickenGroceryItemId}}",
          "unitId": "{{kilogramUnitId}}",
          "quantity": 1
        }
      ]
    }
settings: {}
examples: './.resources/Update a recipe.resources/examples'
order: 4000
