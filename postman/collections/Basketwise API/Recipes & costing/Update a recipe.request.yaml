$kind: http-request
description: Replaces the recipe name, serving yield, optional category and notes, and complete ingredient list atomically. Omit steps to keep saved steps unchanged, or send an empty array to clear them.
url: '{{baseUrl}}/api/recipes/{{recipeId}}'
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: recipeId
    value: '{{recipeId}}'
body:
  type: json
  content: |-
    {
      "name": "Steamed rice",
      "servings": 4,
      "category": "dinner",
      "instructions": "Rinse the rice, then simmer it in water until tender.",
      "steps": [
        {"instruction": "Rinse the rice until the water runs mostly clear."},
        {"instruction": "Add water and simmer until the rice is tender."}
      ],
      "ingredients": [
        {
          "groceryItemId": "{{lastGroceryItemId}}",
          "unitId": "{{kilogramUnitId}}",
          "quantity": 1
        }
      ]
    }
settings: {}
examples: './.resources/Update a recipe.resources/examples'
order: 4000
