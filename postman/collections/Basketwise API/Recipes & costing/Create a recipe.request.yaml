$kind: http-request
description: Saves an example recipe from the grocery item and units created by earlier requests. The recipe ID is saved for the detail, update, and meal-planning requests that follow.
url: '{{baseUrl}}/api/recipes'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Steamed rice",
      "servings": 2,
      "category": "dinner",
      "instructions": "Rinse the rice, then simmer it in water until tender.",
      "steps": [
        {"instruction": "Rinse the rice until the water runs mostly clear."},
        {"instruction": "Add water and simmer until the rice is tender."}
      ],
      "ingredients": [
        {
          "groceryItemId": "{{lastGroceryItemId}}",
          "unitId": "{{kilogramUnitId}}",
          "quantity": 0.5
        }
      ]
    }
settings: {}
examples: './.resources/Create a recipe.resources/examples'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201) {
        const body = pm.response.json();
        pm.collectionVariables.set('recipeId', body.id);
      }
