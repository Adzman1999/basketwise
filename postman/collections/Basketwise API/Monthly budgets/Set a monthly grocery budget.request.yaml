$kind: http-request
description: Creates or replaces the grocery budget target for the selected month. Amounts are PHP centavos.
url: '{{baseUrl}}/api/budgets/{{month}}'
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "budgetCentavos": 5000000
    }
settings: {}
examples: ./.resources/Set a monthly grocery budget.resources/examples
order: 2000
