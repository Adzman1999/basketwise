    type: json
    content: |-
      {
        "items": [
          {
            "id": "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c",
            "name": "Rice"
          }
        ],
        "page": 1,
        "pageSize": 20,
        "total": 1
      }
order: 1000
