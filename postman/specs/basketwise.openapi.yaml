openapi: 3.1.0
info:
  title: Basketwise API
  version: 0.1.0
  description: |
    The Basketwise API. Grocery purchase amounts use Philippine pesos (PHP)
    represented in centavos. The health endpoint reports process liveness only;
    it does not check database readiness.
servers:
  - url: http://localhost:4000
    description: Local development
paths:
  /api/purchases:
    get:
      operationId: listPurchases
      tags:
        - Purchases
      summary: List grocery purchases
      description: |
        Returns purchases by purchase date descending, then creation time
        descending, then ID descending, with receipt line items.
      parameters:
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of purchases per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePage"
              example:
                items:
                  - id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                    purchasedOn: "2026-10-29"
                    storeName: "Neighborhood Market"
                    currency: "PHP"
                    totalPaidCentavos: 12550
                    unallocatedAmountCentavos: 250
                    items:
                      - id: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                        itemName: "Rice"
                        quantity: 2
                        unit: "kg"
                        amountPaidCentavos: 11000
                      - id: "b4c7c876-a686-4caf-b6fd-4861c3e3a718"
                        itemName: "Bananas"
                        quantity: 1
                        unit: "pack"
                        amountPaidCentavos: 1300
                    createdAt: "2026-10-29T08:00:00.000Z"
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createPurchase
      tags:
        - Purchases
      summary: Record a grocery purchase
      description: |
        Records the receipt total and one or more receipt line items. The
        receipt total is authoritative. The API computes the difference between
        the receipt total and the sum of line amounts as
        unallocatedAmountCentavos; it does not classify that difference as tax,
        discount, fee, or rounding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequest"
            example:
              purchasedOn: "2026-10-29"
              storeName: "Neighborhood Market"
              totalPaidCentavos: 12550
              items:
                - itemName: "Rice"
                  quantity: 2
                  unit: "kg"
                  amountPaidCentavos: 11000
                - itemName: "Bananas"
                  quantity: 1
                  unit: "pack"
                  amountPaidCentavos: 1300
      responses:
        "201":
          description: The purchase was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
              example:
                id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                purchasedOn: "2026-10-29"
                storeName: "Neighborhood Market"
                currency: "PHP"
                totalPaidCentavos: 12550
                unallocatedAmountCentavos: 250
                items:
                  - id: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                    itemName: "Rice"
                    quantity: 2
                    unit: "kg"
                    amountPaidCentavos: 11000
                  - id: "b4c7c876-a686-4caf-b6fd-4861c3e3a718"
                    itemName: "Bananas"
                    quantity: 1
                    unit: "pack"
                    amountPaidCentavos: 1300
                createdAt: "2026-10-29T08:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Check API process liveness
      description: Reports that the Basketwise API process is running.
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - app
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - healthy
                  app:
                    type: string
                    enum:
                      - Basketwise API
                  timestamp:
                    type: string
                    format: date-time
              example:
                status: healthy
                app: Basketwise API
                timestamp: "2026-10-29T00:00:00.000Z"
components:
  schemas:
    CreatePurchaseRequest:
      type: object
      additionalProperties: false
      required:
        - purchasedOn
        - totalPaidCentavos
        - items
      properties:
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
          minLength: 1
          maxLength: 120
        totalPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Receipt total in PHP centavos.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreatePurchaseItem"
    CreatePurchaseItem:
      type: object
      additionalProperties: false
      required:
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        unit:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Suggested values are g, kg, ml, l, item, and pack. Custom unit
            labels are accepted. Quantities are not converted between units.
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Amount paid for this line in PHP centavos.
    Purchase:
      type: object
      additionalProperties: false
      required:
        - id
        - purchasedOn
        - currency
        - totalPaidCentavos
        - unallocatedAmountCentavos
        - items
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
        currency:
          type: string
          enum:
            - PHP
        totalPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
        unallocatedAmountCentavos:
          type: integer
          description: Receipt total minus the sum of line item amounts.
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"
        createdAt:
          type: string
          format: date-time
    PurchaseItem:
      type: object
      additionalProperties: false
      required:
        - id
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
      properties:
        id:
          type: string
          format: uuid
        itemName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
    PurchasePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Purchase"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "The request is invalid."
    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "INTERNAL_SERVER_ERROR"
              message: "An unexpected error occurred."
