openapi: 3.1.0
info:
  title: Basketwise API
  version: 0.1.0
  description: |
    The Basketwise API. Grocery purchase amounts use Philippine pesos (PHP)
    represented in centavos. The health endpoint reports process liveness only;
    it does not check database readiness.
servers:
  - url: http://localhost:4000
    description: Local development
paths:
  /api/stores:
    get:
      operationId: listStores
      tags:
        - Stores
      summary: List saved stores and shops
      description: Returns saved places in alphabetical order for selection on a grocery purchase.
      responses:
        "200":
          description: Saved stores and shops.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePage"
              example:
                items:
                  - id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                    name: "Neighborhood Market"
                    category: neighborhood_grocery
                    createdAt: "2026-10-29T08:00:00.000Z"
                total: 1
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createStore
      tags:
        - Stores
      summary: Save a store or shop
      description: Adds a place to the saved list. Names are unique after trimming, lowercasing, and collapsing whitespace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
            example:
              name: "Green Market"
              category: neighborhood_grocery
      responses:
        "201":
          description: The store or shop was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/DuplicateStore"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/purchases:
    get:
      operationId: listPurchases
      tags:
        - Purchases
      summary: List grocery purchases
      description: |
        Returns purchases by purchase date descending, then creation time
        descending, then ID descending, with receipt line items. Optional item
        and store substring searches and inclusive purchase-date bounds are
        applied before pagination; total reports the number of matching receipts.
      parameters:
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of purchases per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          description: Case-insensitive literal substring matched against receipt item names.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: store
          in: query
          required: false
          description: Case-insensitive literal substring matched against the store name.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: from
          in: query
          required: false
          description: Inclusive start purchase date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive end purchase date in YYYY-MM-DD format; must be on or after from.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: A page of purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePage"
              example:
                items:
                  - id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                    purchasedOn: "2026-10-29"
                    storeName: "Neighborhood Market"
                    currency: "PHP"
                    totalPaidCentavos: 12550
                    unallocatedAmountCentavos: 250
                    items:
                      - id: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                        groceryItemId: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                        itemName: "Rice"
                        quantity: 2
                        unit: "kg"
                        amountPaidCentavos: 11000
                      - id: "b4c7c876-a686-4caf-b6fd-4861c3e3a718"
                        groceryItemId: "65fcaec9-a74a-4b8b-becb-0f0733762f35"
                        itemName: "Bananas"
                        quantity: 1
                        unit: "pack"
                        amountPaidCentavos: 1300
                    createdAt: "2026-10-29T08:00:00.000Z"
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createPurchase
      tags:
        - Purchases
      summary: Record a grocery purchase
      description: |
        Records the receipt total and one or more receipt line items. The
        receipt total is authoritative. The API computes the difference between
        the receipt total and the sum of line amounts as
        unallocatedAmountCentavos; it does not classify that difference as tax,
        discount, fee, or rounding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequest"
            example:
              purchasedOn: "2026-10-29"
              storeName: "Neighborhood Market"
              totalPaidCentavos: 12550
              items:
                - itemName: "Rice"
                  quantity: 2
                  unit: "kg"
                  amountPaidCentavos: 11000
                - itemName: "Bananas"
                  quantity: 1
                  unit: "pack"
                  amountPaidCentavos: 1300
      responses:
        "201":
          description: The purchase was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
              example:
                id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                purchasedOn: "2026-10-29"
                storeName: "Neighborhood Market"
                currency: "PHP"
                totalPaidCentavos: 12550
                unallocatedAmountCentavos: 250
                items:
                  - id: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                    groceryItemId: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                    itemName: "Rice"
                    quantity: 2
                    unit: "kg"
                    amountPaidCentavos: 11000
                  - id: "b4c7c876-a686-4caf-b6fd-4861c3e3a718"
                    groceryItemId: "65fcaec9-a74a-4b8b-becb-0f0733762f35"
                    itemName: "Bananas"
                    quantity: 1
                    unit: "pack"
                    amountPaidCentavos: 1300
                createdAt: "2026-10-29T08:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/grocery-items:
    get:
      operationId: listGroceryItems
      tags:
        - Grocery items
      summary: List normalized grocery items
      description: |
        Lists catalog items in name order. Items are created from purchase line
        item names. Names that match after trimming, lowercasing, and collapsing
        whitespace share one catalog identity; fuzzy matches are not made. The
        optional search term matches a literal, case-insensitive substring of
        the normalized catalog name.
      parameters:
        - name: search
          in: query
          required: false
          description: Literal substring to search for in normalized item names.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of grocery items per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of normalized grocery items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryItemPage"
              example:
                items:
                  - id: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                    name: "Rice"
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/grocery-items/{groceryItemId}/price-history:
    get:
      operationId: listGroceryItemPriceHistory
      tags:
        - Grocery items
      summary: List recorded prices for a grocery item
      description: |
        Returns price observations derived from saved purchase lines, newest
        first. Unit labels are matched after trimming, lowercasing, and
        collapsing whitespace. No conversions are made between units, so
        observations with different units must not be compared directly.
        unitPriceCentavos is amountPaidCentavos divided by quantity and rounded
        to six decimal places.
      parameters:
        - name: groceryItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: unit
          in: query
          required: false
          description: Filter to a normalized unit label, such as kg.
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of observations per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of price observations for the grocery item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistoryPage"
              example:
                groceryItem:
                  id: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                  name: "Rice"
                items:
                  - purchaseItemId: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                    purchaseId: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                    purchasedOn: "2026-10-29"
                    storeName: "Neighborhood Market"
                    itemName: "Rice"
                    quantity: 2
                    unit: "kg"
                    amountPaidCentavos: 11000
                    unitPriceCentavos: 5500
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Check API process liveness
      description: Reports that the Basketwise API process is running.
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - app
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - healthy
                  app:
                    type: string
                    enum:
                      - Basketwise API
                  timestamp:
                    type: string
                    format: date-time
              example:
                status: healthy
                app: Basketwise API
                timestamp: "2026-10-29T00:00:00.000Z"
components:
  schemas:
    StoreCategory:
      type: string
      enum:
        - supermarket
        - public_market
        - convenience_store
        - neighborhood_grocery
        - online_grocery
        - other
    CreateStoreRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        category:
          $ref: "#/components/schemas/StoreCategory"
    Store:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - category
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/StoreCategory"
        createdAt:
          type: string
          format: date-time
    StorePage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Store"
        total:
          type: integer
    CreatePurchaseRequest:
      type: object
      additionalProperties: false
      required:
        - purchasedOn
        - totalPaidCentavos
        - items
      properties:
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
          minLength: 1
          maxLength: 120
        totalPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Receipt total in PHP centavos.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreatePurchaseItem"
    CreatePurchaseItem:
      type: object
      additionalProperties: false
      required:
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        unit:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Suggested values are g, kg, ml, l, item, and pack. Custom unit
            labels are accepted. Quantities are not converted between units.
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Amount paid for this line in PHP centavos.
    Purchase:
      type: object
      additionalProperties: false
      required:
        - id
        - purchasedOn
        - currency
        - totalPaidCentavos
        - unallocatedAmountCentavos
        - items
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
        currency:
          type: string
          enum:
            - PHP
        totalPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
        unallocatedAmountCentavos:
          type: integer
          description: Receipt total minus the sum of line item amounts.
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"
        createdAt:
          type: string
          format: date-time
    PurchaseItem:
      type: object
      additionalProperties: false
      required:
        - id
        - groceryItemId
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
      properties:
        id:
          type: string
          format: uuid
        groceryItemId:
          type: string
          format: uuid
          description: Normalized catalog identity associated with this receipt line.
        itemName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
    GroceryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name from the first purchase line with this normalized name.
    GroceryItemPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroceryItem"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PriceObservation:
      type: object
      additionalProperties: false
      required:
        - purchaseItemId
        - purchaseId
        - purchasedOn
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
        - unitPriceCentavos
      properties:
        purchaseItemId:
          type: string
          format: uuid
        purchaseId:
          type: string
          format: uuid
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
        itemName:
          type: string
          description: Receipt-time item name snapshot.
        quantity:
          type: number
        unit:
          type: string
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
        unitPriceCentavos:
          type: number
          description: Amount paid divided by quantity, rounded to six decimal places.
    PriceHistoryPage:
      type: object
      additionalProperties: false
      required:
        - groceryItem
        - items
        - page
        - pageSize
        - total
      properties:
        groceryItem:
          $ref: "#/components/schemas/GroceryItem"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceObservation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PurchasePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Purchase"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    DuplicateStore:
      description: A store or shop with this normalized name already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "DUPLICATE_STORE"
              message: "A store or shop with this name already exists."
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "The request is invalid."
    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "INTERNAL_SERVER_ERROR"
              message: "An unexpected error occurred."
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "NOT_FOUND"
              message: "The requested resource was not found."
