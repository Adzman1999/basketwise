openapi: 3.1.0
info:
  title: Basketwise API
  version: 0.1.0
  description: |
    The Basketwise API. Grocery purchase amounts use Philippine pesos (PHP)
    represented in centavos. The health endpoint reports process liveness only;
    it does not check database readiness.
servers:
  - url: http://localhost:4000
    description: Local development
paths:
  /api/units:
    get:
      operationId: listMeasurementUnits
      tags:
        - Measurement units
      summary: List saved measurement units
      description: Returns preset and custom units for reuse on purchase receipt lines.
      responses:
        "200":
          description: Saved measurement units.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementUnitPage"
              example:
                items:
                  - id: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                    name: "kg"
                    isPreset: true
                    createdAt: "2026-10-29T08:00:00.000Z"
                total: 1
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createMeasurementUnit
      tags:
        - Measurement units
      summary: Save a measurement unit
      description: Adds a custom unit for reuse. Names are unique after trimming, lowercasing, and collapsing whitespace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeasurementUnitRequest"
            example:
              name: "dozen"
      responses:
        "201":
          description: The measurement unit was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/DuplicateUnit"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/pantry:
    get:
      operationId: listPantryStock
      tags:
        - Pantry stock
      summary: List pantry stock
      description: |
        Returns the current tracked quantity for each saved grocery item and
        measurement-unit pair. Quantities are not converted between units.
        Each record's expiry date is the earliest dated lot with quantity still
        on hand; use the lot operations to review or update individual batches.
        The summary counts all pantry records, even when search or status
        filters are applied to the returned page. A zero quantity is out of
        stock; a positive quantity at or below its optional threshold is low.
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive literal substring of the normalized grocery item name.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: status
          in: query
          required: false
          description: Filter to a calculated stock status.
          schema:
            $ref: "#/components/schemas/PantryStockStatus"
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of stock records per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of current pantry records and unfiltered counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryStockPage"
              example:
                items:
                  - id: "e024aa98-29b2-4f40-a467-283ed82cbb44"
                    groceryItemId: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                    itemName: "Rice"
                    unitId: "f56094ec-d967-4011-a490-5ae9ef49e310"
                    unit: "kg"
                    quantity: 1.5
                    lowStockThreshold: 2
                    autoRestock: true
                    expiresOn: "2026-12-15"
                    status: low_stock
                    updatedAt: "2026-11-05T08:00:00.000Z"
                page: 1
                pageSize: 20
                total: 1
                summary:
                  total: 1
                  inStock: 0
                  lowStock: 1
                  outOfStock: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createPantryStock
      tags:
        - Pantry stock
      summary: Add a pantry stock record
      description: |
        Adds a current stock record for a saved grocery item and measurement
        unit. A pair can be tracked only once; use the update operation to
        change an existing quantity or auto-restock setting. When autoRestock
        is true, future purchases with the exact same item and unit increase
        this quantity. An optional receipt-line expiry date is copied to its
        pantry lot; when unknown, it stays empty until set through the lot
        operation. Past purchases are not applied retroactively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePantryStockRequest"
            example:
              groceryItemId: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
              unitId: "f56094ec-d967-4011-a490-5ae9ef49e310"
              quantity: 1.5
              lowStockThreshold: 2
              autoRestock: true
              expiresOn: "2026-12-15"
      responses:
        "201":
          description: The pantry stock record was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryStock"
              example:
                id: "e024aa98-29b2-4f40-a467-283ed82cbb44"
                groceryItemId: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                itemName: "Rice"
                unitId: "f56094ec-d967-4011-a490-5ae9ef49e310"
                unit: "kg"
                quantity: 1.5
                lowStockThreshold: 2
                autoRestock: true
                expiresOn: "2026-12-15"
                status: low_stock
                updatedAt: "2026-11-05T08:00:00.000Z"
        "400":
          description: The request is invalid or references a missing grocery item or unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalidRequest:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The request is invalid.
                invalidReference:
                  value:
                    error:
                      code: INVALID_PANTRY_REFERENCE
                      message: Choose a saved grocery item and measurement unit.
        "409":
          $ref: "#/components/responses/DuplicatePantryStock"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/pantry/lots:
    get:
      operationId: listPantryStockLots
      tags:
        - Pantry stock
      summary: List current pantry stock lots
      description: Returns current positive-quantity batches ordered by earliest expiry, with batches without an expiry date last.
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive literal substring of the normalized grocery item name.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of lots per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of current pantry lots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryStockLotPage"
              example:
                items:
                  - id: "ee7104c9-915b-4789-9efc-134bda74a8bc"
                    pantryStockId: "e024aa98-29b2-4f40-a467-283ed82cbb44"
                    itemName: "Rice"
                    unit: "kg"
                    quantityReceived: 2
                    quantityRemaining: 1.5
                    sourceType: purchase
                    expiresOn: "2026-12-15"
                    receivedAt: "2026-11-10T08:00:00.000Z"
                    purchaseDate: "2026-11-09"
                    storeName: "Market Basket"
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/pantry/lots/{lotId}:
    parameters:
      - name: lotId
        in: path
        required: true
        description: Pantry stock lot UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: updatePantryStockLotExpiry
      tags:
        - Pantry stock
      summary: Update a stock lot expiry date
      description: Updates or clears the expiry date for one active stock lot. The aggregate pantry expiry is recalculated as the earliest dated active lot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePantryStockLotExpiryRequest"
            example:
              expiresOn: "2026-12-15"
      responses:
        "200":
          description: The stock lot with its updated expiry date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryStockLot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/pantry/{pantryStockId}:
    parameters:
      - name: pantryStockId
        in: path
        required: true
        description: Pantry stock record UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: updatePantryStock
      tags:
        - Pantry stock
      summary: Update current pantry quantity
      description: Replaces the current quantity, nullable low-stock threshold, and auto-restock setting. The returned expiry date is the earliest dated lot still in stock; update individual dates through the pantry lot expiry operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePantryStockRequest"
            example:
              quantity: 0.75
              lowStockThreshold: 2
              autoRestock: true
      responses:
        "200":
          description: The pantry stock record was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryStock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deletePantryStock
      tags:
        - Pantry stock
      summary: Remove a pantry stock record
      description: Removes pantry tracking for the item and unit. Grocery purchase history is retained.
      responses:
        "204":
          description: The pantry record was removed; no response body is returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/stores:
    get:
      operationId: listStores
      tags:
        - Stores
      summary: List saved stores and shops
      description: Returns saved places in alphabetical order for selection on a grocery purchase.
      responses:
        "200":
          description: Saved stores and shops.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePage"
              example:
                items:
                  - id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                    name: "Neighborhood Market"
                    category: neighborhood_grocery
                    createdAt: "2026-10-29T08:00:00.000Z"
                total: 1
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createStore
      tags:
        - Stores
      summary: Save a store or shop
      description: Adds a place to the saved list. Names are unique after trimming, lowercasing, and collapsing whitespace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
            example:
              name: "Green Market"
              category: neighborhood_grocery
      responses:
        "201":
          description: The store or shop was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/DuplicateStore"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/budgets/calendar/{month}:
    parameters:
      - name: month
        in: path
        required: true
        description: Calendar month in YYYY-MM format.
        schema:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        example: "2026-11"
    get:
      operationId: getGroceryBudgetCalendar
      tags:
        - Grocery budgets
      summary: Get daily grocery budgets and spending for a month
      description: Returns one entry for every date in the requested month, including daily target, receipt spending, receipt count, remaining amount, and target status.
      responses:
        "200":
          description: Daily budget and spending summaries for the calendar month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryBudgetCalendar"
              example:
                month: "2026-11"
                days:
                  - date: "2026-11-01"
                    budgetCentavos: 500000
                    spentCentavos: 235000
                    receiptCount: 1
                    remainingCentavos: 265000
                    status: remaining
                  - date: "2026-11-02"
                    budgetCentavos: null
                    spentCentavos: 0
                    receiptCount: 0
                    remainingCentavos: null
                    status: no_target
                  - date: "2026-11-03"
                    budgetCentavos: 300000
                    spentCentavos: 300000
                    receiptCount: 1
                    remainingCentavos: 0
                    status: at_limit
                  - date: "2026-11-04"
                    budgetCentavos: 300000
                    spentCentavos: 350000
                    receiptCount: 2
                    remainingCentavos: -50000
                    status: exceeded
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/budgets/{periodType}/{startsOn}/{endsOn}:
    parameters:
      - name: periodType
        in: path
        required: true
        description: Day, Monday-to-Sunday week, calendar month, calendar year, or custom date range.
        schema:
          type: string
          enum: [day, week, month, year, custom]
        example: week
      - name: startsOn
        in: path
        required: true
        description: Inclusive period start date.
        schema:
          type: string
          format: date
        example: "2026-11-02"
      - name: endsOn
        in: path
        required: true
        description: Inclusive period end date. Must match the selected period type, except for custom ranges.
        schema:
          type: string
          format: date
        example: "2026-11-08"
    get:
      operationId: getGroceryBudgetPeriod
      tags:
        - Grocery budgets
      summary: Get grocery spending and budget for a period
      description: |
        Returns receipt spending and count for the inclusive date period, plus
        its optional target. Weekly periods begin on Monday. The MVP stores one
        shared household target for each exact period key; targets are not
        prorated between period types or scoped by a user or household ID.
      responses:
        "200":
          description: The budget and receipt spending summary for the selected period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryBudgetSummary"
              example:
                periodType: week
                startsOn: "2026-11-02"
                endsOn: "2026-11-08"
                currency: "PHP"
                budgetCentavos: 5000000
                spentCentavos: 2350000
                receiptCount: 8
                remainingCentavos: 2650000
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: setGroceryBudgetPeriod
      tags:
        - Grocery budgets
      summary: Set or update a period budget target
      description: Stores a positive target for the exact selected period if it ends today or later in Asia/Manila. Repeating the request replaces that period's target. Historical periods remain available for spending review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBudgetRequest"
            example:
              budgetCentavos: 5000000
      responses:
        "200":
          description: The updated target and spending summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryBudgetSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/PastBudgetPeriod"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: removeGroceryBudgetPeriod
      tags:
        - Grocery budgets
      summary: Remove a period budget target
      description: Removes the target while preserving receipts and returns the period spending summary.
      responses:
        "200":
          description: The spending summary after removing the target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryBudgetSummary"
              example:
                periodType: week
                startsOn: "2026-11-02"
                endsOn: "2026-11-08"
                currency: "PHP"
                budgetCentavos: null
                spentCentavos: 2350000
                receiptCount: 8
                remainingCentavos: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/purchases:
    get:
      operationId: listPurchases
      tags:
        - Purchases
      summary: List grocery purchases
      description: |
        Returns purchases by purchase date descending, then creation time
        descending, then ID descending, with receipt line items. Optional item
        and store substring searches and inclusive purchase-date bounds are
        applied before pagination; total reports the number of matching receipts.
        Each receipt line reports whether it has already been added to pantry
        stock. Set pantryStatus to pending to return receipts with at least one
        line that has not yet changed pantry stock. Purchase dates remain part
        of receipt history and are not used as dates when items are added to
        current pantry stock.
      parameters:
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of purchases per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          description: Case-insensitive literal substring matched against receipt item names.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: store
          in: query
          required: false
          description: Case-insensitive literal substring matched against the store name.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: pantryStatus
          in: query
          required: false
          description: Use pending to return receipts with at least one line not yet added to pantry stock.
          schema:
            type: string
            enum:
              - pending
        - name: from
          in: query
          required: false
          description: Inclusive start purchase date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive end purchase date in YYYY-MM-DD format; must be on or after from.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: A page of purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePage"
              example:
                items:
                  - id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                    purchasedOn: "2026-10-29"
                    storeName: "Neighborhood Market"
                    currency: "PHP"
                    totalPaidCentavos: 12300
                    unallocatedAmountCentavos: 0
                    items:
                      - id: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                        groceryItemId: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                        itemName: "Rice"
                        quantity: 2
                        unit: "kg"
                        amountPaidCentavos: 11000
                        pantryAdded: true
                      - id: "b4c7c876-a686-4caf-b6fd-4861c3e3a718"
                        groceryItemId: "65fcaec9-a74a-4b8b-becb-0f0733762f35"
                        itemName: "Bananas"
                        quantity: 1
                        unit: "pack"
                        amountPaidCentavos: 1300
                        pantryAdded: false
                    createdAt: "2026-10-29T08:00:00.000Z"
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createPurchase
      tags:
        - Purchases
      summary: Record a grocery purchase
      description: |
        Records one or more receipt line items. The receipt total is calculated
        by summing each item's amountPaidCentavos and is returned as
        totalPaidCentavos. The total must fit a signed 32-bit integer. Pantry
        stock records opted into auto-restock are updated for exact item and
        unit matches in the same transaction. When addToPantry is true, all
        receipt lines are also added to pantry stock: new item and unit pairs
        create records, while existing pairs increase their quantity. When it
        is false or omitted, only auto-restock records are updated. The create
        response lists each pantry record updated; a purchase line is applied
        at most once. An optional expiry date on a receipt line is stored with
        its pantry lot. Untracked receipt lines can be added later with the
        pantry action for that purchase, which reuses the saved line date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequest"
            example:
              purchasedOn: "2026-10-29"
              storeName: "Neighborhood Market"
              addToPantry: true
              items:
                - itemName: "Rice"
                  quantity: 2
                  unit: "kg"
                  amountPaidCentavos: 11000
                  expiresOn: "2026-12-15"
                - itemName: "Bananas"
                  quantity: 1
                  unit: "pack"
                  amountPaidCentavos: 1300
      responses:
        "201":
          description: The purchase was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
              example:
                id: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                purchasedOn: "2026-10-29"
                storeName: "Neighborhood Market"
                currency: "PHP"
                totalPaidCentavos: 12300
                unallocatedAmountCentavos: 0
                items:
                  - id: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                    groceryItemId: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                    itemName: "Rice"
                    quantity: 2
                    unit: "kg"
                    amountPaidCentavos: 11000
                    pantryAdded: true
                  - id: "b4c7c876-a686-4caf-b6fd-4861c3e3a718"
                    groceryItemId: "65fcaec9-a74a-4b8b-becb-0f0733762f35"
                    itemName: "Bananas"
                    quantity: 1
                    unit: "pack"
                    amountPaidCentavos: 1300
                    pantryAdded: true
                createdAt: "2026-10-29T08:00:00.000Z"
                pantryRestockedItems:
                  - itemName: "Rice"
                    unit: "kg"
                    quantityAdded: 2
                    quantityOnHand: 3.5
                    expiresOn: "2026-12-15"
                  - itemName: "Bananas"
                    unit: "pack"
                    quantityAdded: 1
                    quantityOnHand: 1
                    expiresOn: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/purchases/{purchaseId}/pantry:
    post:
      operationId: addPurchaseItemsToPantry
      tags:
        - Purchases
      summary: Add untracked receipt items to pantry
      description: |
        Adds receipt lines that have not previously changed pantry stock.
        Missing item and unit pairs are created; existing pairs increase their
        quantity. Previously applied receipt lines are skipped, so repeating
        this request cannot add them twice. The purchase and pantry changes are
        committed together. The receipt's purchasedOn date remains unchanged in
        history; pantry stock is updated at the time this request is processed.
      parameters:
        - name: purchaseId
          in: path
          required: true
          description: Purchase containing the receipt lines to add.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Previously untracked receipt lines were added. Repeating the request returns an empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPurchaseItemsToPantryResponse"
              example:
                pantryRestockedItems:
                  - itemName: "Bananas"
                    unit: "pack"
                    quantityAdded: 1
                    quantityOnHand: 1
                    expiresOn: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The purchase was not found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    type: object
                    additionalProperties: false
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: NOT_FOUND
                  message: The requested purchase was not found.
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/grocery-items:
    get:
      operationId: listGroceryItems
      tags:
        - Grocery items
      summary: List normalized grocery items
      description: |
        Lists catalog items in name order. Items are created from purchase line
        item names. Names that match after trimming, lowercasing, and collapsing
        whitespace share one catalog identity; fuzzy matches are not made. The
        optional search term matches a literal, case-insensitive substring of
        the normalized catalog name.
      parameters:
        - name: search
          in: query
          required: false
          description: Literal substring to search for in normalized item names.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of grocery items per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of normalized grocery items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryItemPage"
              example:
                items:
                  - id: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                    name: "Rice"
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/grocery-items/{groceryItemId}/price-history:
    get:
      operationId: listGroceryItemPriceHistory
      tags:
        - Grocery items
      summary: List recorded prices for a grocery item
      description: |
        Returns price observations derived from saved purchase lines, newest
        first. Unit labels are matched after trimming, lowercasing, and
        collapsing whitespace. No conversions are made between units, so
        observations with different units must not be compared directly.
        unitPriceCentavos is amountPaidCentavos divided by quantity and rounded
        to six decimal places.
      parameters:
        - name: groceryItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: unit
          in: query
          required: false
          description: Filter to a normalized unit label, such as kg.
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: page
          in: query
          required: false
          description: One-based result page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of observations per page, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of price observations for the grocery item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistoryPage"
              example:
                groceryItem:
                  id: "b94ab4f4-cb08-48ce-83a9-ff99f6eb488c"
                  name: "Rice"
                items:
                  - purchaseItemId: "f557ea81-8e28-4bc0-bf38-92b0a1c3331a"
                    purchaseId: "7ef38c55-13ec-4e49-9b50-7d97eb8f5001"
                    purchasedOn: "2026-10-29"
                    storeName: "Neighborhood Market"
                    itemName: "Rice"
                    quantity: 2
                    unit: "kg"
                    amountPaidCentavos: 11000
                    unitPriceCentavos: 5500
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Check API process liveness
      description: Reports that the Basketwise API process is running.
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - app
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - healthy
                  app:
                    type: string
                    enum:
                      - Basketwise API
                  timestamp:
                    type: string
                    format: date-time
              example:
                status: healthy
                app: Basketwise API
                timestamp: "2026-10-29T00:00:00.000Z"
components:
  schemas:
    CreateMeasurementUnitRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
    MeasurementUnit:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - isPreset
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isPreset:
          type: boolean
          description: True for the built-in units g, kg, ml, l, item, and pack.
        createdAt:
          type: string
          format: date-time
    MeasurementUnitPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MeasurementUnit"
        total:
          type: integer
    PantryStockLotSource:
      type: string
      enum: [opening_balance, purchase, manual_adjustment]
    PantryStockLot:
      type: object
      additionalProperties: false
      required:
        - id
        - pantryStockId
        - itemName
        - unit
        - quantityReceived
        - quantityRemaining
        - sourceType
        - expiresOn
        - receivedAt
        - purchaseDate
        - storeName
      properties:
        id:
          type: string
          format: uuid
        pantryStockId:
          type: string
          format: uuid
        itemName:
          type: string
        unit:
          type: string
        quantityReceived:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        quantityRemaining:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        sourceType:
          $ref: "#/components/schemas/PantryStockLotSource"
        expiresOn:
          oneOf:
            - type: string
              format: date
            - type: "null"
        receivedAt:
          type: string
          format: date-time
        purchaseDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        storeName:
          oneOf:
            - type: string
            - type: "null"
    PantryStockLotPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryStockLot"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    UpdatePantryStockLotExpiryRequest:
      type: object
      additionalProperties: false
      required: [expiresOn]
      properties:
        expiresOn:
          oneOf:
            - type: string
              format: date
            - type: "null"
    PantryStockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
    PantryStock:
      type: object
      additionalProperties: false
      required:
        - id
        - groceryItemId
        - itemName
        - unitId
        - unit
        - quantity
        - lowStockThreshold
        - autoRestock
        - expiresOn
        - status
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        groceryItemId:
          type: string
          format: uuid
        itemName:
          type: string
        unitId:
          type: string
          format: uuid
        unit:
          type: string
        quantity:
          type: number
          minimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        lowStockThreshold:
          oneOf:
            - type: number
              minimum: 0
              maximum: 999999999.999
              multipleOf: 0.001
            - type: "null"
        autoRestock:
          type: boolean
          description: Whether future matching receipt lines increase this pantry quantity.
        expiresOn:
          oneOf:
            - type: string
              format: date
            - type: "null"
          description: Earliest expiry among active lots with a known date.
        status:
          $ref: "#/components/schemas/PantryStockStatus"
        updatedAt:
          type: string
          format: date-time
    PantryStockSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - inStock
        - lowStock
        - outOfStock
      properties:
        total:
          type: integer
          minimum: 0
        inStock:
          type: integer
          minimum: 0
        lowStock:
          type: integer
          minimum: 0
        outOfStock:
          type: integer
          minimum: 0
    PantryStockPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
        - summary
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryStock"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Number of records matching the active search and status filters.
        summary:
          $ref: "#/components/schemas/PantryStockSummary"
    CreatePantryStockRequest:
      type: object
      additionalProperties: false
      required:
        - groceryItemId
        - unitId
        - quantity
      properties:
        groceryItemId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        quantity:
          type: number
          minimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        lowStockThreshold:
          oneOf:
            - type: number
              minimum: 0
              maximum: 999999999.999
              multipleOf: 0.001
            - type: "null"
          default: null
        autoRestock:
          type: boolean
          default: false
          description: When true, matching future purchases add their quantity to this record.
        expiresOn:
          oneOf:
            - type: string
              format: date
            - type: "null"
          default: null
          description: Optional expiry date for the initial pantry lot.
    UpdatePantryStockRequest:
      type: object
      additionalProperties: false
      required:
        - quantity
        - lowStockThreshold
        - autoRestock
      properties:
        quantity:
          type: number
          minimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        lowStockThreshold:
          oneOf:
            - type: number
              minimum: 0
              maximum: 999999999.999
              multipleOf: 0.001
            - type: "null"
        autoRestock:
          type: boolean
    StoreCategory:
      type: string
      enum:
        - supermarket
        - public_market
        - convenience_store
        - neighborhood_grocery
        - online_grocery
        - other
    CreateStoreRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        category:
          $ref: "#/components/schemas/StoreCategory"
    Store:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - category
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/StoreCategory"
        createdAt:
          type: string
          format: date-time
    StorePage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Store"
        total:
          type: integer
    SetBudgetRequest:
      type: object
      additionalProperties: false
      required:
        - budgetCentavos
      properties:
        budgetCentavos:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Target for the selected period in PHP centavos.
    GroceryBudgetSummary:
      type: object
      additionalProperties: false
      required:
        - periodType
        - startsOn
        - endsOn
        - currency
        - budgetCentavos
        - spentCentavos
        - receiptCount
        - remainingCentavos
      properties:
        periodType:
          type: string
          enum: [day, week, month, year, custom]
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        currency:
          type: string
          enum:
            - PHP
        budgetCentavos:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 2147483647
            - type: "null"
        spentCentavos:
          type: integer
          minimum: 0
          description: Sum of saved receipt totals for the selected inclusive dates.
        receiptCount:
          type: integer
          minimum: 0
          description: Number of receipts in the selected period.
        remainingCentavos:
          oneOf:
            - type: integer
            - type: "null"
          description: Target minus receipt spending; negative when over budget, null when no target is set.
    GroceryBudgetCalendar:
      type: object
      additionalProperties: false
      required:
        - month
        - days
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        days:
          type: array
          description: One entry for every calendar date in the requested month.
          items:
            $ref: "#/components/schemas/GroceryBudgetCalendarDay"
    GroceryBudgetCalendarDay:
      type: object
      additionalProperties: false
      required:
        - date
        - budgetCentavos
        - spentCentavos
        - receiptCount
        - remainingCentavos
        - status
      properties:
        date:
          type: string
          format: date
        budgetCentavos:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 2147483647
            - type: "null"
          description: Daily target, if one is set.
        spentCentavos:
          type: integer
          minimum: 0
          description: Sum of receipt totals for this date.
        receiptCount:
          type: integer
          minimum: 0
        remainingCentavos:
          oneOf:
            - type: integer
            - type: "null"
          description: Daily target minus spend, or null when no target is set.
        status:
          type: string
          enum: [no_target, remaining, at_limit, exceeded]
    CreatePurchaseRequest:
      type: object
      additionalProperties: false
      required:
        - purchasedOn
        - items
      properties:
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
          minLength: 1
          maxLength: 120
        addToPantry:
          type: boolean
          default: false
          description: |
            When true, all receipt lines add to pantry stock. Otherwise only
            records with auto-restock enabled are updated.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreatePurchaseItem"
    CreatePurchaseItem:
      type: object
      additionalProperties: false
      required:
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
        unit:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Suggested values are g, kg, ml, l, item, and pack. Custom unit
            labels are accepted. Quantities are not converted between units.
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Amount paid for this line in PHP centavos.
        expiresOn:
          oneOf:
            - type: string
              format: date
            - type: "null"
          description: Optional expiry date stored for the pantry lot created from this receipt line.
    Purchase:
      type: object
      additionalProperties: false
      required:
        - id
        - purchasedOn
        - currency
        - totalPaidCentavos
        - unallocatedAmountCentavos
        - items
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
        currency:
          type: string
          enum:
            - PHP
        totalPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
        unallocatedAmountCentavos:
          type: integer
          description: Receipt total minus the sum of line item amounts.
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"
        createdAt:
          type: string
          format: date-time
        pantryRestockedItems:
          type: array
          description: Pantry records created or updated by purchase creation; omitted from purchase history responses.
          items:
            $ref: "#/components/schemas/PantryRestockedItem"
    PantryRestockedItem:
      type: object
      additionalProperties: false
      required:
        - itemName
        - unit
        - quantityAdded
        - quantityOnHand
        - expiresOn
      properties:
        itemName:
          type: string
        unit:
          type: string
        quantityAdded:
          type: number
          minimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
          description: Total quantity added from matching receipt lines for this item and unit.
        quantityOnHand:
          type: number
          minimum: 0
          maximum: 999999999.999
          multipleOf: 0.001
          description: Pantry quantity after applying this purchase.
        expiresOn:
          oneOf:
            - type: string
              format: date
            - type: "null"
    AddPurchaseItemsToPantryResponse:
      type: object
      additionalProperties: false
      required:
        - pantryRestockedItems
      properties:
        pantryRestockedItems:
          type: array
          items:
            $ref: "#/components/schemas/PantryRestockedItem"
    PurchaseItem:
      type: object
      additionalProperties: false
      required:
        - id
        - groceryItemId
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
        - pantryAdded
      properties:
        id:
          type: string
          format: uuid
        groceryItemId:
          type: string
          format: uuid
          description: Normalized catalog identity associated with this receipt line.
        itemName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
        pantryAdded:
          type: boolean
          description: Whether this receipt line has already been applied to pantry stock.
    GroceryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name from the first purchase line with this normalized name.
    GroceryItemPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroceryItem"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PriceObservation:
      type: object
      additionalProperties: false
      required:
        - purchaseItemId
        - purchaseId
        - purchasedOn
        - itemName
        - quantity
        - unit
        - amountPaidCentavos
        - unitPriceCentavos
      properties:
        purchaseItemId:
          type: string
          format: uuid
        purchaseId:
          type: string
          format: uuid
        purchasedOn:
          type: string
          format: date
        storeName:
          type: string
        itemName:
          type: string
          description: Receipt-time item name snapshot.
        quantity:
          type: number
        unit:
          type: string
        amountPaidCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
        unitPriceCentavos:
          type: number
          description: Amount paid divided by quantity, rounded to six decimal places.
    PriceHistoryPage:
      type: object
      additionalProperties: false
      required:
        - groceryItem
        - items
        - page
        - pageSize
        - total
      properties:
        groceryItem:
          $ref: "#/components/schemas/GroceryItem"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceObservation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PurchasePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Purchase"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    DuplicatePantryStock:
      description: A record already exists for this grocery item and unit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "DUPLICATE_PANTRY_STOCK"
              message: "This grocery item and unit are already tracked in the pantry. Update its current stock instead."
    DuplicateUnit:
      description: A measurement unit with this normalized name already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "DUPLICATE_UNIT"
              message: "This unit is already saved."
    DuplicateStore:
      description: A store or shop with this normalized name already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "DUPLICATE_STORE"
              message: "A store or shop with this name already exists."
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "The request is invalid."
    PastBudgetPeriod:
      description: A budget target cannot be set for a period that ended before today in Asia/Manila.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "PAST_BUDGET_PERIOD"
              message: "Budget targets can only be set for today or a future period."
    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "INTERNAL_SERVER_ERROR"
              message: "An unexpected error occurred."
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: "NOT_FOUND"
              message: "The requested resource was not found."
