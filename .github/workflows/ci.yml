name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Postman CLI
        run: npm install --global postman-cli@1.76.0

      - name: Lint OpenAPI syntax
        run: postman spec lint postman/specs/basketwise.openapi.yaml --issueType syntax --no-report-events

      - name: Lint Postman collection
        run: postman collection lint 'postman/collections/Basketwise API' --fail-severity error

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run API tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build
